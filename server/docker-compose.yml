services:
  api:
    build: .
    image: watchtracker_api:26.07.10
    restart: unless-stopped
    env_file:
      - .env
      - ${COMMON_SECRETS_FILE:-/volume1/homes/sheik37.v/docker/common/.secrets}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-720}
      AUTH_TOKEN_CLEANUP_INTERVAL_SECONDS: ${AUTH_TOKEN_CLEANUP_INTERVAL_SECONDS:-3600}
      AUTH_ALERT_WINDOW_SECONDS: ${AUTH_ALERT_WINDOW_SECONDS:-300}
      AUTH_ALERT_FAILURE_THRESHOLD: ${AUTH_ALERT_FAILURE_THRESHOLD:-10}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_2FA_EMAIL: ${ADMIN_2FA_EMAIL:-}
      ADMIN_2FA_TOTP_SECRET: ${ADMIN_2FA_TOTP_SECRET:-}
      ADMIN_2FA_TOTP_WINDOW_STEPS: ${ADMIN_2FA_TOTP_WINDOW_STEPS:-1}
      ADMIN_2FA_TOTP_PERIOD_SECONDS: ${ADMIN_2FA_TOTP_PERIOD_SECONDS:-30}
      ADMIN_2FA_TOTP_DIGITS: ${ADMIN_2FA_TOTP_DIGITS:-6}
    networks:
      - watchtracker_db_net

networks:
  watchtracker_db_net:
    external: true
