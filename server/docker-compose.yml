services:
  api:
    build: .
    image: watchtracker_api:26.07.00
    restart: unless-stopped
    env_file:
      - .env
      - ${COMMON_SECRETS_FILE:-/volume1/homes/sheik37.v/docker/common/.secrets}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-720}
      AUTH_TOKEN_CLEANUP_INTERVAL_SECONDS: ${AUTH_TOKEN_CLEANUP_INTERVAL_SECONDS:-3600}
      AUTH_ALERT_WINDOW_SECONDS: ${AUTH_ALERT_WINDOW_SECONDS:-300}
      AUTH_ALERT_FAILURE_THRESHOLD: ${AUTH_ALERT_FAILURE_THRESHOLD:-10}
    networks:
      - watchtracker_db_net
  duckdns:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    env_file:
      - .env
      - ${COMMON_SECRETS_FILE:-/volume1/homes/sheik37.v/docker/common/.secrets}
    command: >
      sh -c "while true; do
      curl -fsS \"https://www.duckdns.org/update?domains=$$DUCKDNS_DOMAIN&token=$$DUCKDNS_TOKEN&ip=\";
      sleep 300;
      done"

networks:
  watchtracker_db_net:
    external: true