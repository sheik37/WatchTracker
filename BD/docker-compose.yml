services:
  postgres:
    image: postgres:16
    container_name: watchtracker_postgres
    restart: unless-stopped
    env_file:
      - .env
      - ${COMMON_SECRETS_FILE:-/volume1/homes/sheik37.v/docker/common/.secrets}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - watchtracker_db_net

  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: watchtracker_pgadmin
    restart: unless-stopped
    user: "0:0"
    env_file:
      - .env
      - ${COMMON_SECRETS_FILE:-/volume1/homes/sheik37.v/docker/common/.secrets}
    environment:
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    ports:
      - "${PGADMIN_BIND_ADDRESS:-192.168.1.113}:${PGADMIN_HOST_PORT:-8085}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - watchtracker_db_net

networks:
  watchtracker_db_net:
    name: watchtracker_db_net

volumes:
  pgadmin_data: