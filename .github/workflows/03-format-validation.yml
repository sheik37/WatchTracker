name: ✅ Format & Commits

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]

jobs:
  line_endings:
    name: 📄 Line Ending Enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔍 Check line endings
        run: |
          echo "Vérifying LF on shell scripts..."
          CRLF_FILES=$(find . -name "*.sh" -not -path "./.git/*" -type f -exec grep -l $'\r' {} \; 2>/dev/null)
          if [ -n "$CRLF_FILES" ]; then
            echo "❌ CRLF found in these shell scripts:"
            echo "$CRLF_FILES"
            echo "Use: git config core.autocrlf false"
            exit 1
          fi
          echo "✓ Tous les scripts sont en LF"

  commit_messages:
    name: 📝 Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔍 Check commit messages
        run: |
          echo "Vérifying commits are in French..."
          FRENCH_KEYWORDS="feat|fix|docs|style|refactor|test|chore|perf|amélioration|ajout|correction|suppression"
          BASE="${{ github.base_ref }}"
          
          COMMITS=$(git log origin/${BASE}..HEAD --format="%s" 2>/dev/null || true)
          
          if [ -z "$COMMITS" ]; then
            echo "✓ Aucun commit à vérifier"
            exit 0
          fi
          
          echo "Commits à vérifier:"
          echo "$COMMITS"
          
          INVALID=$(echo "$COMMITS" | grep -vE "^(${FRENCH_KEYWORDS}):" | grep -v "^Merge " || true)
          
          if [ -n "$INVALID" ]; then
            echo ""
            echo "❌ Commits invalides trouvés:"
            echo "$INVALID"
            echo ""
            echo "Les messages doivent commencer par: feat:, fix:, docs:, style:, refactor:, test:, chore:, perf:"
            exit 1
          fi
          echo "✓ Messages de commits valides"

  trailing_whitespace:
    name: 🎯 Trailing Whitespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 🔍 Check trailing whitespace
        run: |
          if git diff-index --check --cached HEAD; then
            echo "✓ Aucun whitespace trailing détecté"
          else
            echo "❌ Whitespace trailing trouvé"
            exit 1
          fi

  file_sizes:
    name: 📦 Large File Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 🔍 Check for large files
        run: |
          MAX_SIZE=50000000  # 50MB
          LARGE_FILES=$(find . -size +${MAX_SIZE}c -type f -not -path './.git/*' -not -path './.gradle/*' -not -path './build/*' 2>/dev/null)
          
          if [ -n "$LARGE_FILES" ]; then
            echo "❌ Fichiers trop volumineux trouvés:"
            echo "$LARGE_FILES"
            exit 1
          fi
          echo "✓ Tous les fichiers sont de taille acceptable"
