name: 🚀 Auto-Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.github/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔖 Create release
        id: release
        uses: google-github-actions/release-please-action@v4
        with:
          target-branch: main
          release-type: simple
          include-v-in-tag: true
          bump-minor-pre-major: true
          default-branch: main
          extra-files: |
            flutter_app/pubspec.yaml:
              updater-template: 'version: {{version}}+1'

  build_release_apk:
    name: 🏗️ Build Release APK
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.release_created == 'true'
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      
      - name: 📥 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true
      
      - name: 🔧 Get dependencies
        run: cd flutter_app && flutter pub get
      
      - name: 🏗️ Build release APK
        run: cd flutter_app && flutter build apk --release -v
      
      - name: 📤 Upload APK to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: flutter_app/build/app/outputs/flutter-app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_release_docker:
    name: 🐳 Push Docker Release
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.release_created == 'true'
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🔑 Login to Docker Hub (optionnel)
        uses: docker/login-action@v3
        if: secrets.DOCKER_USERNAME != ''
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: 🏗️ Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}/watchtracker-api:${{ needs.release.outputs.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
