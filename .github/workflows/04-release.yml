name: Release Mobile

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build_apk:
    name: Build and Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Get dependencies
        run: cd flutter_app && flutter pub get

      - name: Build APK
        run: cd flutter_app && flutter build apk --release

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "WatchTracker ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: flutter_app/build/app/outputs/flutter-app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build_apk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: watchtracker-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_ios:
    name: Build iOS Artifact
    runs-on: macos-latest
    needs: build_apk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Get dependencies
        run: cd flutter_app && flutter pub get

      - name: Build iOS
        run: cd flutter_app && flutter build ios --release --no-codesign

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Archive iOS app
        run: |
          cd flutter_app/build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app Runner.app.zip

      - name: Upload iOS artifact to workflow
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-ios
          path: flutter_app/build/ios/iphoneos/Runner.app.zip
          retention-days: 30

      - name: Upload iOS artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: flutter_app/build/ios/iphoneos/Runner.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
