name: Release Mobile

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  resolve_version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Resolve version metadata
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          else
            RAW_VERSION="${{ github.ref_name }}"
          fi

          VERSION="${RAW_VERSION#v}"

          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${{ github.run_number }}" >> $GITHUB_OUTPUT

  build_apk:
    name: Build and Release APK
    runs-on: ubuntu-latest
    needs: resolve_version
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Get dependencies
        run: cd flutter_app && flutter pub get

      - name: Build APK
        run: |
          cd flutter_app
          flutter build apk --release \
            --build-name="${{ needs.resolve_version.outputs.version }}" \
            --build-number="${{ needs.resolve_version.outputs.build_number }}" \
            --dart-define=APP_VERSION="${{ needs.resolve_version.outputs.version }}" \
            --dart-define=APP_BUILD_NUMBER="${{ needs.resolve_version.outputs.build_number }}" \
            --dart-define=TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}" \
            --dart-define=TVDB_API_KEY="${{ secrets.TVDB_API_KEY }}" \
            --dart-define=BACKEND_BASE_URL="${{ secrets.BACKEND_BASE_URL }}"

      - name: Prepare APK asset
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk "WatchTracker-${{ needs.resolve_version.outputs.tag }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve_version.outputs.tag }}
          name: "WatchTracker ${{ needs.resolve_version.outputs.tag }}"
          generate_release_notes: true
          files: WatchTracker-${{ needs.resolve_version.outputs.tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build_apk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: watchtracker-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish_version_json:
    name: Publish version.json
    runs-on: ubuntu-latest
    needs: [resolve_version, build_apk]
    steps:
      - name: Generate version.json
        run: |
          VERSION="${{ needs.resolve_version.outputs.version }}"
          BUILD="${{ needs.resolve_version.outputs.build_number }}"
          TAG="${{ needs.resolve_version.outputs.tag }}"
          REPO="${{ github.repository }}"
          APK_URL="https://github.com/${REPO}/releases/download/${TAG}/WatchTracker-${TAG}.apk"
          NOTES="Voir les notes de version : https://github.com/${REPO}/releases/tag/${TAG}"

          jq -n \
            --arg version "$VERSION" \
            --argjson build "$BUILD" \
            --arg android_url "$APK_URL" \
            --arg notes "$NOTES" \
            '{latest_version: $version, latest_build: $build, android_url: $android_url, ios_url: "", release_notes: $notes}' \
            > version.json

          echo "=== version.json généré ==="
          cat version.json

      - name: Upload version.json to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve_version.outputs.tag }}
          files: version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_ios:
    name: Build iOS Artifact
    runs-on: macos-latest
    needs: [resolve_version, build_apk]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Get dependencies
        run: cd flutter_app && flutter pub get

      - name: Build iOS
        run: |
          cd flutter_app
          flutter build ios --release --no-codesign \
            --build-name="${{ needs.resolve_version.outputs.version }}" \
            --build-number="${{ needs.resolve_version.outputs.build_number }}" \
            --dart-define=APP_VERSION="${{ needs.resolve_version.outputs.version }}" \
            --dart-define=APP_BUILD_NUMBER="${{ needs.resolve_version.outputs.build_number }}" \
            --dart-define=TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}" \
            --dart-define=TVDB_API_KEY="${{ secrets.TVDB_API_KEY }}" \
            --dart-define=BACKEND_BASE_URL="${{ secrets.BACKEND_BASE_URL }}"

      - name: Archive iOS app
        run: |
          cd flutter_app/build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app Runner.app.zip

      - name: Upload iOS artifact to workflow
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-ios
          path: flutter_app/build/ios/iphoneos/Runner.app.zip
          retention-days: 30

      - name: Upload iOS artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve_version.outputs.tag }}
          files: flutter_app/build/ios/iphoneos/Runner.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
