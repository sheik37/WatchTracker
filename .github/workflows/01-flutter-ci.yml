name: 📱 CI Flutter

on:
  push:
    branches: [main, develop, feature/**]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/01-flutter-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'flutter_app/**'

jobs:
  analyze:
    name: 🔍 Analyze & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 📥 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true
      
      - name: 🔧 Get dependencies
        run: cd flutter_app && flutter pub get
      
      - name: 📊 Analyze
        run: cd flutter_app && flutter analyze --no-pub --fatal-infos
      
      - name: ✨ Format check
        run: cd flutter_app && dart format --set-exit-if-changed .

  test:
    name: 🧪 Unit & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 📥 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true
      
      - name: 🔧 Get dependencies
        run: cd flutter_app && flutter pub get
      
      - name: 🧪 Run tests
        run: cd flutter_app && flutter test --coverage
      
      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./flutter_app/coverage/lcov.info
          flags: flutter
        if: always()
