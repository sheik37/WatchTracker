name: 🔔 Notifications & Alertes

on:
  workflow_run:
    workflows: ['📱 CI Flutter', '🔌 CI Backend API']
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  notify_on_failure:
    name: 🔴 Alert on Failure
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'push'
    steps:
      - name: 📤 Log workflow info
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            console.log('Workflow failed:', run.name);
            console.log('Branch:', run.head_branch);
            console.log('Commit:', run.head_commit.message);
            console.log('URL:', run.html_url);

      - name: 🐛 Create bug issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `🔴 Build Failed: ${run.name}`;
            const body = [
              '## Build Failure Report',
              '',
              `Workflow: **${run.name}**`,
              `Branch: **${run.head_branch}**`,
              `Commit: ${run.head_commit.sha}`,
              `Author: ${run.head_commit.author.name}`,
              '',
              `[Voir les logs complets](${run.html_url})`,
              '',
              '---',
              '*Issue créée automatiquement par GitHub Actions*'
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['ci-failure']
            });

            const recentIssue = issues.data.find(issue =>
              new Date(issue.created_at) > new Date(Date.now() - 6 * 3600 * 1000)
            );

            if (!recentIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['ci-failure', 'bug']
              });
              console.log('Issue créée');
            } else {
              console.log('Issue existante trouvée, skipped');
            }

  notify_on_success:
    name: 🟢 Log Success
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    steps:
      - name: ✅ Log success
        run: |
          echo "✅ Workflow réussi: ${{ github.event.workflow_run.name }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Pour activer les notifications Slack/email, configurer les secrets SLACK_WEBHOOK ou MAIL_*"