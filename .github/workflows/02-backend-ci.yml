name: 🔌 CI Backend API

on:
  push:
    branches: [main, develop, feature/**]
    paths:
      - 'server/**'
      - '.github/workflows/02-backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'server/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📥 Install dependencies
        run: cd server && pip install -r requirements.txt flake8 black isort
      
      - name: ✨ Black format check
        run: cd server && black --check .
      
      - name: 🔤 isort import check
        run: cd server && isort --check-only . --profile black
      
      - name: 🐛 Flake8 lint
        run: cd server && flake8 . --max-line-length=100 --ignore=E203,W503,E501 --exclude=.git,__pycache__,.pytest_cache

  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: watchtracker_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📥 Install dependencies
        run: cd server && pip install -r requirements.txt
      
      - name: 🧪 Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/watchtracker_test
        run: cd server && python -m pytest tests/ -v --tb=short --cov=. --cov-report=xml
      
      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./server/coverage.xml
          flags: backend
        if: always()

  security:
    name: 🔐 Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📥 Install dependencies
        run: cd server && pip install -r requirements.txt bandit safety
      
      - name: 🔐 Bandit security scan
        run: cd server && bandit -r . -f json -o bandit-report.json || true
      
      - name: ⚠️ Safety dependency check
        run: cd server && safety check --json || true

  build_docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🏗️ Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: watchtracker-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
